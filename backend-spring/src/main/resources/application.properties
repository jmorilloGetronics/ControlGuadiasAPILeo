spring.application.name=guardias-backend
server.port=4000
server.servlet.context-path=/

# --- CONFIGURACIÓN MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/guardias_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
# 'update' crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- INICIALIZACIÓN DE DATOS (IMPORTANTE) ---
# 'embedded' asegura que solo ejecute scripts si la tabla está lista o si usas H2, 
# pero con 'defer-datasource-initialization' forzamos a que espere a Hibernate.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Esto evita errores si el data.sql intenta insertar algo que ya existe (duplicate keys)
spring.sql.init.continue-on-error=true

# --- LOGGING ---
logging.level.root=INFO
logging.level.com.leo.backend=DEBUG

# --- SWAGGER / OPENAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs